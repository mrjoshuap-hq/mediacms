name: Frontend build and test

on:
    workflow_call:
    workflow_dispatch:

# github.workflow is the caller name, so CI and Release get different groups
# and cannot cancel each other. The frontend- prefix keeps this group distinct
# from the caller's own group (same name would deadlock the caller).
# Push and dispatch runs are per-run and never cancel or displace each other;
# only superseded PR runs cancel.
concurrency:
    group: frontend-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('{0}-{1}', github.event_name, github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build-and-test:
        strategy:
            matrix:
                os: [ubuntu-latest]
                node: [24]
        runs-on: ${{ matrix.os }}
        name: '${{ matrix.os }} - node v${{ matrix.node }}'
        permissions:
            contents: read
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}

            - name: Install dependencies
              run: npm install

            - name: Lint script
              run: npm run lint

            - name: Test script
              run: npm run test -- --ci

            - name: Coverage summary
              run: npm run test-coverage -- --ci --coverageReporters=text-summary --coverageReporters=json-summary

            - name: Build script
              run: npm run dist
