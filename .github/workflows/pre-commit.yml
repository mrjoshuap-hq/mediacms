name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            frontend-tools/video-js/package-lock.json
            frontend-tools/video-editor/package-lock.json
            frontend-tools/chapters-editor/package-lock.json

      - name: Install frontend dependencies
        run: |
          # frontend/package-lock.json is gitignored; use npm install there.
          npm install --prefix frontend
          npm ci --prefix frontend-tools/video-js
          npm ci --prefix frontend-tools/video-editor
          npm ci --prefix frontend-tools/chapters-editor

      # pre-commit/action v3.0.1 (inner actions/cache@v4). Pinned to a full SHA.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
