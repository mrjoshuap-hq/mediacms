name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            frontend-tools/video-js/package-lock.json
            frontend-tools/video-editor/package-lock.json
            frontend-tools/chapters-editor/package-lock.json

      - name: Install frontend dependencies
        run: |
          # frontend/package-lock.json is gitignored; use npm install there.
          npm install --prefix frontend
          npm ci --prefix frontend-tools/video-js
          npm ci --prefix frontend-tools/video-editor
          npm ci --prefix frontend-tools/chapters-editor

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ runner.os }}-${{ runner.arch }}|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
